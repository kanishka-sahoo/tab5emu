# Decision D1: one pinned ESP-IDF version and exact component versions.
# Transitive dependencies are locked in /dependencies.lock (committed).
# Board-support dependencies live here so that only retro_hal can use them.
dependencies:
  idf: "==5.5.5"
  espressif/m5stack_tab5: "==1.3.1"
  espressif/esp_codec_dev: "==1.5.11"
  espressif/usb: "==1.5.0"
  espressif/esp_lvgl_port: "==2.9.0"
  # The BSP depends on it privately; bsp/touch.h includes its header.
  espressif/esp_lcd_touch: "==1.2.1"
